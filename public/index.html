<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>BINGO</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ==================== LOGIN / REGISTER SCREEN ==================== -->
  <div id="auth-screen" class="screen active">
    <div class="container">
      <div class="logo">🎱 BINGO 🎱</div>
      <div id="auth-forms">
        <!-- Login Form -->
        <form id="login-form" class="auth-form">
          <h2 data-i18n="login">Login</h2>
          <input type="text" id="login-username" placeholder="Username" required>
          <input type="password" id="login-password" placeholder="Password" required>
          <button type="submit" class="btn green" data-i18n="login">Login</button>
          <p class="switch-link"><a href="#" id="show-register" data-i18n="register">Register</a></p>
        </form>

        <!-- Register Form (hidden initially) -->
        <form id="register-form" class="auth-form" style="display:none;">
          <h2 data-i18n="register">Register</h2>
          <input type="text" id="reg-username" placeholder="Username" required>
          <input type="password" id="reg-password" placeholder="Password" required>
          <input type="password" id="reg-confirm" placeholder="Confirm Password" required>
          <input type="text" id="reg-referral" placeholder="Referral Code (optional)">
          <button type="submit" class="btn green" data-i18n="register">Register</button>
          <p class="switch-link"><a href="#" id="show-login" data-i18n="login">Login</a></p>
        </form>
      </div>
      <div id="language-select">
        <select id="lang-select">
          <option value="en">English</option>
          <option value="om">Afaan Oromo</option>
          <option value="am">አማርኛ</option>
          <option value="ti">ትግርኛ</option>
        </select>
      </div>
    </div>
  </div>

  <!-- ==================== MAIN GAME SCREEN ==================== -->
  <div id="game-screen" class="screen">
    <nav class="top-bar">
      <button id="home-btn" class="btn small" data-i18n="home">🏠 Home</button>
      <span class="balance-display">💰 <span id="balance-amount">0</span></span>
      <button id="logout-btn" class="btn small red" data-i18n="logout">Logout</button>
    </nav>

    <!-- Lobby (stake selection & card purchase) -->
    <div id="lobby-view" class="view active">
      <h2 data-i18n="select_stake">Select Stake</h2>
      <div class="stake-buttons">
        <button class="stake-btn" data-stake="10">10</button>
        <button class="stake-btn" data-stake="20">20</button>
        <button class="stake-btn" data-stake="50">50</button>
        <button class="stake-btn" data-stake="100">100</button>
      </div>
      <div id="card-purchase">
        <h3 data-i18n="cards_to_buy">Cards (max 4)</h3>
        <input type="number" id="card-count" min="1" max="4" value="1">
        <button id="buy-cards-btn" class="btn orange" data-i18n="buy_cards">Buy Cards</button>
      </div>
      <div id="lobby-info">
        <p>👥 <span data-i18n="players">Players</span>: <span id="player-count">0</span></p>
        <p>🏆 <span data-i18n="prize">Prize Pool</span>: <span id="prize-pool">0</span></p>
        <p id="game-status-text"></p>
      </div>
    </div>

    <!-- Countdown / Game Active View -->
    <div id="game-view" class="view">
      <div id="countdown-timer" class="hidden">
        <h2 data-i18n="game_countdown">Game starting in</h2>
        <div id="countdown-seconds">30</div>
      </div>
      <div id="active-game">
        <div class="called-section">
          <h3 data-i18n="called_numbers">Called Numbers</h3>
          <div id="called-numbers-container"></div>
        </div>
        <div id="bingo-cards-container">
          <!-- Cards are rendered dynamically -->
        </div>
        <button id="bingo-claim-btn" class="btn green hidden" data-i18n="claim_bingo">BINGO!</button>
      </div>
    </div>

    <!-- Winner Announcement (overlay) -->
    <div id="winner-overlay" class="overlay hidden">
      <div class="winner-box">
        <h1 class="bingo-fancy">🎉 BINGO! 🎉</h1>
        <p id="winner-info"></p>
        <div id="next-game-countdown"></div>
      </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-menu">
      <button id="menu-deposit" class="btn small green" data-i18n="deposit">+ Deposit</button>
      <button id="menu-withdraw" class="btn small red" data-i18n="withdraw">- Withdraw</button>
      <button id="menu-referral" class="btn small" data-i18n="referral_code">👥 Referral</button>
      <button id="menu-sos" class="btn small red" data-i18n="sos_message">🆘 SOS</button>
    </div>
  </div>

  <!-- ==================== ADMIN PANEL ==================== -->
  <div id="admin-screen" class="screen">
    <nav class="top-bar">
      <button id="admin-back-btn" class="btn small" data-i18n="home">🏠 Home</button>
      <span>ADMIN</span>
      <span></span>
    </nav>
    <div class="admin-container">
      <h2>Admin Panel</h2>
      <div class="admin-tabs">
        <button class="tab-btn active" data-tab="dashboard">Dashboard</button>
        <button class="tab-btn" data-tab="users">Users</button>
        <button class="tab-btn" data-tab="financial">Financial</button>
        <button class="tab-btn" data-tab="bots">Bots</button>
        <button class="tab-btn" data-tab="messages">Messages</button>
        <button class="tab-btn" data-tab="settings">Settings</button>
      </div>
      <div id="admin-content">
        <!-- Tab contents loaded dynamically by app.js -->
      </div>
    </div>
  </div>

  <!-- Modals for deposit/withdraw/sos -->
  <div id="modal-overlay" class="overlay hidden">
    <div class="modal" id="modal-content"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
